<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Flow — 30s marketing film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700;800&family=Archivo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="video-scenes.jsx"></script>
<script type="text/babel">
  const { useTime, useSprite } = window;
  function Film() {
    return (
      <Stage width={1920} height={1080} duration={30} background={SF.C.paper} persistKey="sf-film">
        <SF.Grain />
        <Sprite start={0}    end={6.4}>  <SF.SceneHook /></Sprite>
        <Sprite start={6.0}  end={12.7}> <SF.SceneProblem /></Sprite>
        <Sprite start={12.2} end={20.7}> <SF.SceneDemo /></Sprite>
        <Sprite start={20.2} end={25.9}> <SF.ScenePrivacy /></Sprite>
        <Sprite start={25.4} end={30}>   <SF.SceneCTA /></Sprite>
        <SF.Progress />
      </Stage>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Film />);
</script>
</body>
</html>
